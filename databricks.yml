# MLB CV demo: Serverless GPU (AI Runtime) training with the native
# `ai_runtime_task` DABs task type.
#
# The workspace comes from the CLI profile you select (-p) or DATABRICKS_HOST.
# No host is hardcoded here.
#
#   databricks bundle validate -t dev -p <profile>
#   databricks bundle deploy   -t dev -p <profile> [--var catalog=... --var schema=...]
#   databricks bundle run mlb_air_yolo_train -t dev -p <profile>
bundle:
  name: mlb_air_yolo_demo

include:
  - resources/*.yml

# Package the GPU code (src/train, src/infer) as tarballs. `ai_runtime_task` unpacks
# them on every GPU node (same layout as `databricks air convert-to-dabs` emits).
# ai_runtime_task has no task parameters, so the build step also writes the bundle
# variables into <component>/run_config.env inside the tarball. command.sh sources
# that file, so `--var catalog=... --var schema=...` reaches the GPU tasks too.
artifacts:
  train_code:
    type: tgz
    path: .
    build: bash scripts/package_code.sh train ${var.catalog} ${var.schema} ${var.model_name}
    files:
      - source: ./dist/train_code.tgz
  infer_code:
    type: tgz
    path: .
    build: bash scripts/package_code.sh infer ${var.catalog} ${var.schema} ${var.model_name}
    files:
      - source: ./dist/infer_code.tgz

variables:
  catalog:
    description: Unity Catalog catalog for tables, volumes and the registered model
    default: cmegdemos_catalog
  schema:
    description: Unity Catalog schema
    default: mlb_air_migration
  model_name:
    description: Registered model name (created in <catalog>.<schema>)
    default: mlb_yolo_detector
  experiment:
    description: MLflow experiment name for the GPU training task
    default: mlb-air-yolo

targets:
  dev:
    mode: development
    default: true
    # workspace.host intentionally omitted: it comes from the selected profile.
